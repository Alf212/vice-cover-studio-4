<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vice Cover Studio — GTA-style cover maker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header id="topbar">
  <h1>Vice Cover Studio</h1>
  <p class="tagline">Turn your photos into multi-panel GTA-style cover art. Offline, nothing is uploaded.</p>
</header>

<main id="layout">
  <section id="controls" aria-label="Cover controls">
    <div class="group">
      <label for="layoutSelect">Panel layout</label>
      <select id="layoutSelect">
        <option value="trio">Trio — one wide, two below</option>
        <option value="quad">Quad — four equal panels</option>
        <option value="strips">Strips — five vertical slices</option>
        <option value="hero">Hero — one big, three small</option>
      </select>
    </div>

    <div class="group">
      <label for="sizeSelect">Cover size</label>
      <select id="sizeSelect">
        <option value="1080x1080">Square 1080 x 1080</option>
        <option value="1080x1350">Portrait 1080 x 1350</option>
        <option value="1920x1080">Wide 1920 x 1080</option>
      </select>
    </div>

    <div class="group">
      <label for="photoInput">Your photos</label>
      <input id="photoInput" type="file" accept="image/*" multiple>
      <div class="row">
        <button id="samplePier" type="button">Sample: the pier</button>
        <button id="sampleBlvd" type="button">Sample: the boulevard</button>
      </div>
      <div class="row">
        <button id="shuffleBtn" type="button">Shuffle photos across panels</button>
      </div>
      <p class="hint">Photos fill the panels in order. Click a panel on the
      cover to select it, drag to reposition its photo, and zoom below.</p>
    </div>

    <div class="group">
      <label for="zoomRange">Selected panel zoom</label>
      <input id="zoomRange" type="range" min="1" max="3" step="0.01" value="1">
    </div>

    <div class="group">
      <label for="gradeSelect">Colour grade</label>
      <select id="gradeSelect">
        <option value="sunset">Vice sunset</option>
        <option value="neon">Neon night</option>
        <option value="none">None</option>
      </select>
    </div>

    <div class="group">
      <label for="titleInput">Cover title</label>
      <input id="titleInput" type="text" maxlength="24" value="VICE CITY HEAT">
      <label for="subtitleInput">Subtitle</label>
      <input id="subtitleInput" type="text" maxlength="40" value="one last score in the neon republic">
    </div>

    <div class="group">
      <button id="exportBtn" type="button" class="primary">Export PNG</button>
      <p class="hint" id="statusLine">Add a photo, or start from a sample.</p>
    </div>
  </section>

  <section id="stage" aria-label="Cover preview">
    <canvas id="cover" width="1080" height="1080"></canvas>
  </section>
</main>

<script type="module" src="src/cover.js"></script>
</body>
</html>
